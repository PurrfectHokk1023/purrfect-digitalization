<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa De Vera · Concept Demo by Purrfect Digitalization</title>
<meta name="description" content="Try a working private-resort booking system: booking page, Messenger answers, GCash down payments, Airbnb calendar sync, check-in, turnover and owner report.">
<link rel="icon" type="image/png" sizes="64x64" href="img/mark-64.png">
<link rel="apple-touch-icon" href="img/mark-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell (top bar + Guest/Owner switch) over one working area; green = direct booking, orange = Airbnb, blue = action. */
:root{
  --bg:#f4f6f8; --surface:#fff; --ink:#131c2a; --muted:#5d6876; --line:#e1e5ea;
  --accent:#e8601a; --accent-soft:#fdeee5; --blue:#2563eb; --blue-soft:#e6eefc; --good:#1f8a4c; --good-soft:#e2f3e8;
  --air:#e2553a; --air-soft:#fde7e1; --dir:#1f9d6b; --dir-soft:#ddf3ea; --warn:#b7791f; --warn-soft:#f8efdc;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07111e; --surface:#0f1b2d; --ink:#eef2f8; --muted:#9aa6b8; --line:#22314a;
  --accent:#ff7a33; --accent-soft:#3a2216; --blue:#6aa1ff; --blue-soft:#15274a; --good:#4fd18b; --good-soft:#123222;
  --air:#ff7b61; --air-soft:#3a1d17; --dir:#3fd19a; --dir-soft:#11332a; --warn:#f2b350; --warn-soft:#3a2f17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07111e; --surface:#0f1b2d; --ink:#eef2f8; --muted:#9aa6b8; --line:#22314a;
  --accent:#ff7a33; --accent-soft:#3a2216; --blue:#6aa1ff; --blue-soft:#15274a; --good:#4fd18b; --good-soft:#123222;
  --air:#ff7b61; --air-soft:#3a1d17; --dir:#3fd19a; --dir-soft:#11332a; --warn:#f2b350; --warn-soft:#3a2f17; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0;line-height:1.15}
h2{font-size:20px}h3{font-size:16px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.badge{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--body);padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-air{background:var(--air-soft);color:var(--air)}.b-dir{background:var(--dir-soft);color:var(--dir)}
.b-warn{background:var(--warn-soft);color:var(--warn)}.b-good{background:var(--good-soft);color:var(--good)}.b-blue{background:var(--blue-soft);color:var(--blue)}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:62px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:34px;border-radius:9px;background:#fff;padding:3px}
.brand b{display:block;font:800 16px var(--display);letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px}
.seg{display:inline-flex;margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.note{background:var(--warn-soft);color:var(--ink);font-size:13.5px;font-weight:600}
.note .wrap{padding-block:8px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.note a{color:var(--blue);font-weight:600}

/* guest view */
.gview{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:20px;padding-block:20px 40px;align-items:start}
.gview>*,.ph-in,.panel,.row .grow{min-width:0}
.hero{position:relative;border-radius:16px 16px 0 0;overflow:hidden;aspect-ratio:16/7;background:var(--line)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .ov{position:absolute;inset:auto 0 0 0;padding:16px 18px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff}
.hero .ov h1{font-size:clamp(22px,3vw,30px)}
.hero .ov span{font-size:13.5px;opacity:.9}
.hero .tag{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:4px 10px;border-radius:999px}
.bk{padding:18px;display:grid;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chips button:hover{border-color:var(--blue)}
.chips button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.hero img{transition:opacity .25s ease}
.stay{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.stay b{font-weight:700}
.calhead{display:flex;align-items:center;gap:8px}
.calhead h3{margin-right:auto}
.calhead button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:11.5px;color:var(--muted);text-align:center;font-weight:600}
.cal .c{min-height:54px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px}
.cal .c b{font-size:14px}
.cal .c small{font-size:10.5px;color:var(--muted)}
.cal .blank{border:0;background:transparent}
.cal .past{opacity:.35}
.cal .booked{background:repeating-linear-gradient(135deg,var(--bg),var(--bg) 6px,var(--line) 6px,var(--line) 7px);color:var(--muted)}
.cal .sel{background:var(--blue);border-color:var(--blue);color:#fff}.cal .sel small{color:#fff}
.cal button.c:not(:disabled):hover{border-color:var(--blue)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
.panel{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;background:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row .grow{flex:1;min-width:150px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:15px;color:var(--ink)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.step button{width:36px;height:36px;border:0;background:transparent;font-size:18px}
.step output{min-width:34px;text-align:center;font-weight:700}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.sum .t{font-weight:700;border-top:1px dashed var(--line);padding-top:6px}

/* messenger phone */
.phone{border:1px solid var(--line);border-radius:28px;background:var(--surface);padding:10px;position:sticky;top:78px}
.ph-in{border-radius:20px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;height:min(640px,calc(100vh - 120px))}
.ph-top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ph-top img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.ph-top b{display:block;font-size:14.5px}.ph-top small{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px}
.ph-top small::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.msg{max-width:86%;padding:9px 12px;border-radius:16px;font-size:14px;line-height:1.45}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.msg .act{margin-top:8px}
.qchips{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-top:1px solid var(--line);scrollbar-width:none}
.qchips button{flex:none;border:1px solid var(--blue);color:var(--blue);background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
.ph-in form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.ph-in form input{flex:1;min-width:0;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px}
.ph-in form button{width:40px;height:40px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:17px}
.phone .cap{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 2px}

/* owner view */
.oview{padding-block:16px 40px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs .n{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:17px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{padding:14px 16px}
.tile span{font-size:13px;color:var(--muted)}
.tile b{display:block;font:800 26px var(--display);letter-spacing:-.02em;margin-top:2px}
.tile small{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.box{padding:16px;display:grid;gap:12px;align-content:start}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.todo{display:grid;gap:8px}
.todo button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px}
.todo button span:last-child{margin-left:auto;color:var(--blue);font-weight:600;font-size:13px}
.ocal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.ocal .wd{font-size:11.5px;color:var(--muted);text-align:center;font-weight:600}
.ocal .c{min-height:78px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:6px;font-size:12px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.ocal .c b{font-size:13px}
.ocal .blank{border:0;background:transparent}
.ocal .c.air{background:var(--air-soft);border-color:var(--air)}.ocal .c.dir{background:var(--dir-soft);border-color:var(--dir)}
.ocal .c.pen{border:2px dashed var(--warn)}
.ocal .c.today{outline:2px solid var(--blue);outline-offset:1px}
.ocal .c .g{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.loglist{display:grid;gap:6px;font-size:13.5px}
.loglist div{display:flex;gap:10px;padding:8px 10px;border-radius:10px;background:var(--bg)}
.loglist time{color:var(--muted);font-family:var(--mono);font-size:12px;flex:none;width:120px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tblwrap{overflow-x:auto}
.ck{display:grid;gap:8px}
.ck label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:14px}
.ck input{width:20px;height:20px;accent-color:var(--good)}
.ck label.done{opacity:.6;text-decoration:line-through}
.prev{border-left:3px solid var(--blue);padding:10px 12px;background:var(--bg);border-radius:0 10px 10px 0;font-size:14px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.ci{display:grid;grid-template-columns:240px 1fr;gap:16px}
.ci img{width:100%;border-radius:12px;aspect-ratio:4/3;object-fit:cover}

dialog{border:0;border-radius:18px;padding:0;max-width:440px;width:calc(100% - 32px);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(5,10,20,.55)}
.dlg{padding:20px;display:grid;gap:14px}
.gcash{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--blue-soft)}
.gcash .q{width:64px;height:64px;border-radius:8px;background:#fff;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:5px;flex:none}
.gcash .q i{background:#0b1324;border-radius:1px}.gcash .q i.o{background:transparent}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 14px 30px -10px rgba(0,0,0,.4);z-index:50;max-width:calc(100% - 32px)}

@media (max-width:900px){.gview{grid-template-columns:minmax(0,1fr)}.phone{position:static}.ph-in{height:560px}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}.ci{grid-template-columns:minmax(0,1fr)}.ci img{max-width:280px}}
@media (max-width:520px){.cal .c{min-height:46px}.cal .c small{font-size:9.5px}.ocal .c{min-height:60px;font-size:10.5px;padding:4px}.ocal .c .g{display:none}.seg{margin-left:0}.top .wrap{gap:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><img id="brandimg" src="img/mark-64.png" alt=""><div><b id="brandname"></b><small id="brandsub"></small></div></div>
    <div class="seg" role="group" aria-label="Switch view">
      <button type="button" data-act="view" data-v="guest" aria-pressed="true">Guest view</button>
      <button type="button" data-act="view" data-v="owner" aria-pressed="false">Owner view</button>
    </div>
    <button class="btn sm" type="button" data-act="reset">Reset demo</button>
  </div>
</header>
<div class="note" role="note"><div class="wrap"><span id="notetext"></span><a href="https://purrfectdigital.online/#demo">Talk to Purrfect Digitalization</a></div></div>

<main id="guest" class="wrap gview"></main>
<main id="owner" class="wrap oview" hidden>
  <nav class="tabs" role="tablist" aria-label="Owner sections" id="otabs"></nav>
  <section id="opanel" aria-live="polite"></section>
</main>

<dialog id="dlg" aria-labelledby="dlgtitle"><div class="dlg" id="dlgbody"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  // ---- resort settings (the Casa De Vera copy swaps this block) ----
  const CFG = {
    name: 'Casa De Vera Private Resort', short: 'Casa De Vera', place: 'San Mateo, Rizal', sample: false,
    store: 'casaDemo', photo: 'img/staycation.webp', gcash: '',
    weekday: 21000, weekend: 22000, maxPax: 24, extraFee: 500, cleanFee: 3000,
  };
  // ------------------------------------------------------------------
  // personalized link from the demo booking on the home page (#d=…): the lead's name, rates, stay type and guest cap.
  // Only the public sample takes it; the Casa De Vera concept copy keeps its own settings.
  const PD = (() => { try { const m = location.hash.match(/[#&]d=([\w-]+)/), o = m && JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/'))))); return o && o.t === 'stay' && o.n ? o : null; } catch (e) { return null; } })();
  const STAYS = { '22-hour stay': ['22-hour stay', '8:00 AM', '6:00 AM', 1, '22 hours'], 'Day tour': ['Day tour', '8:00 AM', '5:00 PM', 0, '9 hours'],
    Overnight: ['Overnight stay', '2:00 PM', '12:00 NN', 1, '22 hours'], 'Per night': ['Per-night stay', '2:00 PM', '12:00 NN', 1, ''] };
  if (PD && CFG.sample) {
    const s = PD.s || {}, amt = v => Math.max(500, Math.min(999999, Math.round(Number(v) || 0)));
    const name = String(PD.n).replace(/[<>`]/g, '').trim().slice(0, 60);
    Object.assign(CFG, { name, short: name, place: '', sample: false, personal: true, store: 'resortDemo:' + name, stay: STAYS[s.st] ? s.st : '22-hour stay',
      weekday: amt(s.wd || s.we), weekend: amt(s.we || s.wd), maxPax: Math.max(2, Math.min(200, Math.round(Number(s.mx) || CFG.maxPax))) });
  }
  const [STAY, CI, CO, NEXT, HRS] = STAYS[CFG.stay] || STAYS['22-hour stay'];
  const PHOTOS = [['all', 'Overview', CFG.photo], ['pax', `Up to ${CFG.maxPax} guests`, 'img/rs-group.webp'], ['pool', 'Pool + jacuzzi', 'img/rs-pool.webp'],
    ['vip', 'VIP room jacuzzi', 'img/rs-vip.webp'], ['kar', 'Karaoke room', 'img/rs-karaoke.webp'], ['bil', 'Billiards', 'img/rs-billiards.webp'], ['pet', 'Pet-friendly', 'img/rs-pet.webp']];
  const photoOf = k => PHOTOS.find(p => p[0] === k) || PHOTOS[0];
  const photoTag = k => `${CFG.sample ? 'Sample photo' : 'Sample photo, your photos go here'} · ${photoOf(k)[1]}`;
  PHOTOS.forEach(p => { const im = new Image(); im.src = p[2]; });
  const TODAY = '2026-11-04';
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const P = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const iso = d => d.toISOString().slice(0, 10);
  const addD = (s, n) => { const d = P(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
  const dow = s => P(s).getUTCDay();
  const fd = s => `${DAYS[dow(s)]}, ${MON[P(s).getUTCMonth()]} ${P(s).getUTCDate()}`;
  const rate = s => [5, 6, 0].includes(dow(s)) ? CFG.weekend : CFG.weekday;
  const peso = n => '₱' + Math.round(n).toLocaleString('en-PH');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = id => document.getElementById(id);

  const CHECK = [['b1', 'Bedroom 1: king bed linens changed'], ['b2', 'Bunk room 2: linens and floor'], ['b3', 'Bunk room 3: linens and floor'],
    ['cr', '3 bathrooms cleaned, toiletries refilled'], ['pool', 'Pool skimmed, chlorine checked'], ['jac', 'Pool jacuzzi cleaned'],
    ['vip', 'VIP room jacuzzi cleaned'], ['kar', 'Karaoke room reset, mics charged'], ['kit', 'Kitchen, dining and griller area'], ['sup', 'Supplies: trash bags, tissue, soap']];
  const allKeys = CHECK.map(c => c[0]);

  const fresh0 = () => ({
    view: 'guest', otab: 'dash', photo: 'all', gmonth: '2026-11', omonth: '2026-11', sel: null, pax: 15, pets: false, gname: '', gmobile: '', nextId: 108, ci: null,
    bookings: [

      return `<tr><td class="num"><b>${fd(b.date)}</b><br><span class="muted small">${b.id}</span></td><td>${esc(b.guest)}<br><span class="muted small">${b.pax} guests${b.pets ? ' · pets' : ''}</span></td><td>${chBadge(b)}</td><td class="num">${peso(b.price)}</td><td>${dpTxt}</td><td>${stBadge(b)}</td><td>${act}</td></tr>`;
    }).join('');
    return `<div class="card box"><h3>All bookings</h3><div class="tblwrap"><table class="tbl"><thead><tr><th>Date</th><th>Guest</th><th>Channel</th><th>Rate</th><th>Down payment</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
<span class="muted small">Tip: book a date in Guest view, then confirm its down payment here.</span></div>`;
  }

  function ci() {
    const arr = S.bookings.filter(b => b.date === TODAY && b.status === 'confirmed');
    const inh = S.bookings.filter(b => b.status === 'in');
    let h = '';
    if (arr.length) {
      const b = arr[0];
      if (!S.ci || S.ci.id !== b.id) S.ci = { id: b.id, actual: b.pax, smoke: false, pet: false, method: 'Cash' };
      const extra = Math.max(0, S.ci.actual - b.pax), fee = extra * CFG.extraFee + (S.ci.smoke ? CFG.cleanFee : 0) + (S.ci.pet ? CFG.cleanFee : 0);
      const bal = b.ch === 'air' ? 0 : b.price - b.dp;
      h += `<div class="card box"><h3>Arriving today: ${esc(b.guest)} ${chBadge(b)}</h3>
<div class="ci"><img src="img/guest-checkin.webp" alt="Caretaker welcoming guests" width="1400" height="933">
<form id="ciform" class="panel" onsubmit="return false">
  <div class="row"><span class="grow">Declared at booking</span><b class="num">${b.pax} guests</b></div>
  <div class="row"><span class="grow">Actual headcount at the gate</span><span class="step"><button type="button" data-act="actual" data-k="-1" aria-label="Fewer">−</button><output class="num">${S.ci.actual}</output><button type="button" data-act="actual" data-k="1" aria-label="More">+</button></span></div>
  ${extra ? `<div class="row small"><span class="grow">${extra} undeclared guest${extra > 1 ? 's' : ''} × ${peso(CFG.extraFee)}</span><b class="num">${peso(extra * CFG.extraFee)}</b></div>` : ''}
  <label class="row small"><input type="checkbox" name="smoke" ${S.ci.smoke ? 'checked' : ''}> Smoking in a no-smoking area (${peso(CFG.cleanFee)} cleaning fee)</label>
  <label class="row small"><input type="checkbox" name="pet" ${S.ci.pet ? 'checked' : ''}> Pet accident inside (${peso(CFG.cleanFee)} cleaning fee)</label>
  <div class="sum num"><span>Balance of the stay</span><span>${peso(bal)}</span><span>Extra fees</span><span>${peso(fee)}</span><span class="t">Collect now</span><span class="t">${peso(bal + fee)}</span></div>
  <label class="f">Paid by<select name="method">${['Cash', 'GCash', 'Bank transfer'].map(m => `<option ${S.ci.method === m ? 'selected' : ''}>${m}</option>`).join('')}</select></label>
  <button class="btn pri" type="button" data-act="checkin" data-id="${b.id}">Complete check-in</button>
</form></div></div>`;
    }
    h += inh.map(b => `<div class="card box" style="margin-top:12px"><h3>In-house: ${esc(b.guest)} ${chBadge(b)}</h3>
<div class="row"><span class="grow small">Checked in ${fd(b.date)} · ${b.actual || b.pax} guests · fees ${peso(feesOf(b))}. Check-out before ${CO}, ${fd(addD(b.date, NEXT))}.</span>
<button class="btn blue" type="button" data-act="checkout" data-id="${b.id}">Check out + start turnover</button></div></div>`).join('');
    return h || '<div class="card empty">No arrivals or in-house guests right now. The next arrival shows here on its check-in day.</div>';
  }

  function turn() {
    const open = S.bookings.filter(b => b.turn && !b.turn.ready);
    if (!open.length) return '<div class="card empty">All turnovers done. The next one opens when guests check out.</div>';
    return open.map(b => {
      const nxt = S.bookings.filter(x => x.date > b.date && x.status !== 'cancelled').sort((a, c) => a.date.localeCompare(c.date))[0];
      const done = b.turn.done.length, all = CHECK.length;
      return `<div class="card box" style="margin-bottom:12px"><div class="row"><h3 class="grow">After ${esc(b.guest)} (${fd(b.date)})</h3>${nxt ? `<span class="badge b-blue">Next guests: ${fd(nxt.date)}, ${CI}</span>` : ''}</div>
<div class="bar"><i style="width:${done / all * 100}%;background:var(--good)"></i></div><span class="small muted">${done} of ${all} done</span>
<div class="ck">${CHECK.map(([k, l]) => `<label class="${b.turn.done.includes(k) ? 'done' : ''}"><input type="checkbox" data-tick="${b.id}:${k}" ${b.turn.done.includes(k) ? 'checked' : ''}> ${l}</label>`).join('')}</div>
<button class="btn pri" type="button" data-act="ready" data-id="${b.id}" ${done === all ? '' : 'disabled'}>Ready for the next guests</button></div>`;
    }).join('');
  }

  function rev() {
    const due = S.bookings.filter(b => b.review === 'due'), sent = S.bookings.filter(b => b.review === 'sent');
    const msg = b => b.ch === 'air'
      ? `<b>Airbnb scheduled message</b><br>Hi ${esc(b.guest.split(' ')[0])}! Thank you for staying at ${esc(CFG.short)}. If you enjoyed it, a review on Airbnb helps us a lot. Safe travels!`
      : `<b>Messenger</b><br>Salamat po for staying at ${esc(CFG.short)}, ${esc(b.guest)}! Mind leaving a recommendation on our Facebook page? As a returning guest, message us to book direct for your next stay.`;
    return (due.length ? due.map(b => `<div class="card box" style="margin-bottom:12px"><div class="row"><h3 class="grow">${esc(b.guest)} · checked out ${fd(addD(b.date, 1))}</h3>${chBadge(b)}</div>
<div class="prev">${msg(b)}</div><div class="row"><button class="btn blue" type="button" data-act="review" data-id="${b.id}">Send thank-you + review request</button></div></div>`).join('')
      : '<div class="card empty">No review requests due. They appear here after each check-out.</div>')
      + (sent.length ? `<div class="card box" style="margin-top:12px"><h3>Sent</h3>${sent.map(b => `<div class="row small"><span class="grow">${esc(b.guest)} · ${fd(b.date)}</span>${chBadge(b)}<span class="badge b-good">Sent</span></div>`).join('')}</div>` : '');
  }

  // ---------- dialog: GCash down payment ----------
  const qr = () => { const on1 = [0, 1, 2, 4, 6, 7, 9, 13, 14, 16, 18, 20, 22, 24, 26, 28, 30, 32, 34, 36, 37, 38, 40, 42, 44, 45, 46, 48]; return Array.from({ length: 49 }, (_, i) => `<i class="${on1.includes(i) ? '' : 'o'}"></i>`).join(''); };
  let attached = false;
  function openPay() {
    const s = S.sel, price = rate(s), dp = price / 2; attached = false;
    $('dlgbody').innerHTML = `<h2 id="dlgtitle">Pay the down payment</h2>
<div class="gcash"><div class="q" aria-hidden="true">${qr()}</div><div><b class="num">${peso(dp)}</b> via GCash<br><span class="small">${CFG.sample ? 'GCash ' + CFG.gcash + ' (sample)' : 'Your GCash QR goes here'} · ${esc(CFG.short)}</span></div></div>
<div class="sum num small"><span>${fd(s)}, ${STAY.toLowerCase()} · ${S.pax} guests${S.pets ? ' · pets' : ''}</span><span>${peso(price)}</span><span>Balance on arrival</span><span>${peso(price - dp)}</span></div>
<label class="f">GCash reference number<input id="gref" inputmode="numeric" placeholder="13 digits from your GCash receipt" maxlength="16"></label>
<button class="btn" type="button" data-act="attach" id="attachbtn">📎 Attach payment screenshot</button>
<div class="row"><button class="btn" type="button" data-act="closedlg">Cancel</button><button class="btn pri grow" type="button" data-act="paysubmit" id="paybtn" disabled>Submit for confirmation</button></div>
<span class="muted small">Demo: no money moves. The owner confirms the payment in Owner view.</span>`;
    $('gref').addEventListener('input', payReady);
    $('dlg').showModal();
  }
  const payReady = () => { $('paybtn').disabled = !(attached && $('gref').value.replace(/\D/g, '').length >= 10); };

  // ---------- actions ----------
  const ACT = {
    view: t => { S.view = t.dataset.v; save(); render(); window.scrollTo(0, 0); },
    reset: () => { if (confirm('Reset the demo to its starting data?')) { S = fresh(); S.chat.push({ who: 'bot', t: `Hi po! 👋 Thanks for messaging ${esc(CFG.short)}. Ask about rates, open dates, pets or check-in time; I reply right away.` }); save(); render(); toast('Demo reset'); } },
    gmonth: t => { S.gmonth = shiftMonth(S.gmonth, +t.dataset.k); save(); renderGuest(); },
    omonth: t => { S.omonth = shiftMonth(S.omonth, +t.dataset.k); save(); renderOwner(); },
    pick: t => { S.sel = t.dataset.d; save(); renderGuest(); },
    photo: t => {
      S.photo = t.dataset.k; save();
      const [, label, src] = photoOf(S.photo), img = $('heroimg');
      document.querySelectorAll('[data-act="photo"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === S.photo)));
      $('herotag').textContent = photoTag(S.photo);
      img.style.opacity = 0;
      setTimeout(() => { img.onload = () => (img.style.opacity = 1); img.src = src; img.alt = label; if (img.complete) img.style.opacity = 1; }, 180);
    },
    pax: t => { S.pax = Math.min(CFG.maxPax, Math.max(1, S.pax + +t.dataset.k)); save(); renderGuest(); },
    book: () => openPay(),
    attach: t => { attached = true; t.textContent = '✅ payment-screenshot.jpg attached'; payReady(); },
    closedlg: () => $('dlg').close(),
    paysubmit: () => {
      const s = S.sel, price = rate(s), id = 'DR-0' + S.nextId++;
      S.bookings.push({ id, ch: 'dir', date: s, guest: S.gname.trim(), mobile: S.gmobile, pax: S.pax, pets: S.pets, price, dp: price / 2, dps: 'review', ref: $('gref').value.trim(), status: 'pending', fees: [] });
      S.log.unshift({ t: 'Just now', m: `Exported ${id} · ${fd(s)} blocked on Airbnb` });
      S.chat.push({ who: 'bot', t: `Thank you po, ${esc(S.gname.trim().split(' ')[0])}! We received your down payment proof for <b>${fd(s)}</b> (ref ${id}). We'll confirm shortly and send house rules, the map pin and directions here.` });
      S.sel = null; save(); $('dlg').close(); render();
      toast(`Booking ${id} sent. ${fd(s)} is now blocked here and on Airbnb.`);
    },
    chip: t => ask(t.textContent),
    chatgo: t => {
      if (t.dataset.d) { S.sel = t.dataset.d; S.gmonth = t.dataset.d.slice(0, 7); }
      save(); renderGuest();
      document.querySelector('.cal')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    },
    otab: t => { S.otab = t.dataset.t; S.view = 'owner'; save(); render(); },
    confirm: t => { const b = byId(t.dataset.id); b.dps = 'paid'; b.status = 'confirmed'; save(); renderOwner(); toast(`Confirmed ${b.id}: receipt, house rules and directions sent to ${b.guest}`); },
    actual: t => { S.ci.actual = Math.max(1, S.ci.actual + +t.dataset.k); save(); renderOwner(); },
    checkin: t => {
      const b = byId(t.dataset.id), extra = Math.max(0, S.ci.actual - b.pax);
      if (extra) b.fees.push({ l: `${extra} undeclared guest${extra > 1 ? 's' : ''}`, a: extra * CFG.extraFee });
      if (S.ci.smoke) b.fees.push({ l: 'Smoking cleaning fee', a: CFG.cleanFee });
      if (S.ci.pet) b.fees.push({ l: 'Pet cleaning fee', a: CFG.cleanFee });
      b.actual = S.ci.actual; b.status = 'in'; b.paidBy = S.ci.method; S.ci = null; save(); renderOwner();
      toast(`${b.guest} checked in · ${peso(feesOf(b))} in fees recorded`);
    },
    checkout: t => { const b = byId(t.dataset.id); b.status = 'out'; b.turn = { done: [], ready: false }; b.review = 'due'; S.otab = 'turn'; save(); renderOwner(); toast(`${b.guest} checked out · turnover checklist opened`); },
    ready: t => { const b = byId(t.dataset.id); b.turn.ready = true; save(); renderOwner(); toast('Resort marked ready for the next guests'); },
    review: t => { const b = byId(t.dataset.id); b.review = 'sent'; save(); renderOwner(); toast(`Thank-you + review request sent to ${b.guest}`); },
    simab: () => {
      const f = S.feed.shift(); if (!f) return;
      if (on(f.date)) { S.log.unshift({ t: 'Just now', m: `Skipped ${f.id}: ${fd(f.date)} already booked` }); }
      else {
        S.bookings.push({ id: f.id, ch: 'air', date: f.date, guest: f.guest, pax: f.pax, price: f.price, dp: 0, dps: 'airbnb', status: 'confirmed', fees: [] });
        S.log.unshift({ t: 'Just now', m: `Imported Airbnb booking ${f.id} · ${fd(f.date)} blocked on your booking page` });
        S.omonth = f.date.slice(0, 7);
      }
      save(); renderOwner(); toast(`New Airbnb booking: ${fd(f.date)} is now blocked on your booking page`);
    },
  };
  document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (t && !t.disabled && ACT[t.dataset.act]) ACT[t.dataset.act](t, e); });

  function render() {
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.view)));
    $('guest').hidden = S.view !== 'guest'; $('owner').hidden = S.view !== 'owner';
    if (S.view === 'guest') renderGuest(); else renderOwner();
  }
  render();
})();
</script>
</body>
</html>
