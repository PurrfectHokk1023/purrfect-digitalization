<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pawkit CS Assistant</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2a2c;--muted:#66757a;--line:#e3ded3;--brand:#0f7a6c;--brand-ink:#fff;--soft:#e4f3f0;--warn:#a85a00;--warn-bg:#fff3df;--user:#0f7a6c;--radius:16px}
@media (prefers-color-scheme:dark){:root{--bg:#101718;--card:#182224;--ink:#e8eeee;--muted:#93a3a6;--line:#2a383b;--brand:#3fc1ae;--brand-ink:#06211d;--soft:#16302c;--warn:#ffc57a;--warn-bg:#3a2a10;--user:#1f8f7f}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;flex-direction:column;height:100dvh;max-width:860px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:20px;flex:none}
header h1{font-size:17px;margin:0;line-height:1.2}
header p{margin:0;font-size:12.5px;color:var(--muted)}
header .sp{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.hello{margin:auto 0;text-align:center;padding:12px 0}
.hello h2{font-size:22px;margin:0 0 6px}
.hello p{color:var(--muted);margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;text-align:left}
.chip:hover{border-color:var(--brand)}
.msg{max-width:92%;border-radius:var(--radius);padding:11px 14px;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--user);color:#fff;border-bottom-right-radius:5px;white-space:pre-wrap}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.bot p{margin:0 0 8px}.msg.bot p:last-child{margin-bottom:0}
.msg.bot ol,.msg.bot ul{margin:0 0 8px;padding-left:22px}
.msg.bot li{margin:2px 0}
.msg.bot a{color:var(--brand)}
.msg.bot table{border-collapse:collapse;margin:0 0 8px;font-size:14px;display:block;overflow-x:auto}
.msg.bot th,.msg.bot td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.reply{background:var(--soft);border-radius:12px;padding:10px 12px;margin:6px 0 8px}
.reply .rh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:700;color:var(--brand);margin-bottom:4px}
.reply .rb{white-space:pre-wrap}
.copy{background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted)}
.meta a{color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;text-decoration:none}
.meta a:hover{color:var(--brand);border-color:var(--brand)}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:6px 10px;font-size:13px;margin-bottom:8px}
.typing{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:3px;animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots span{animation:none}main{scroll-behavior:auto}}
form.ask{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);align-items:flex-end}
form.ask textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;min-height:44px;max-height:180px;outline:none}
form.ask textarea:focus{border-color:var(--brand)}
.send{background:var(--brand);color:var(--brand-ink);border:0;border-radius:14px;padding:0 18px;height:44px;font-weight:700}
.send:disabled{opacity:.5;cursor:default}
.gate{margin:auto;width:min(360px,100% - 32px);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;text-align:center}
.gate .logo{margin:0 auto 12px;width:52px;height:52px;font-size:28px;border-radius:16px}
.gate h2{margin:0 0 4px;font-size:20px}
.gate p{margin:0 0 16px;color:var(--muted);font-size:14px}
.gate input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;text-align:center;outline:none}
.gate input:focus{border-color:var(--brand)}
.gate button{width:100%;margin-top:10px;height:44px;border-radius:12px;border:0;background:var(--brand);color:var(--brand-ink);font-weight:700}
.gate .err{color:#c0392b;font-size:13.5px;min-height:20px;margin-top:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <section class="gate" id="gate" hidden>
    <div class="logo">🐾</div>
    <h2>Pawkit CS Assistant</h2>
    <p>For the Pawkit Customer Service team. Enter the team passcode.</p>
    <form id="gateForm">
      <input id="pass" type="password" autocomplete="current-password" placeholder="Team passcode" aria-label="Team passcode" required>
      <button type="submit" id="gateBtn">Enter</button>
      <div class="err" id="gateErr" role="alert"></div>
    </form>
  </section>

  <header id="top" hidden>
    <div class="logo">🐾</div>
    <div><h1>Pawkit</h1><p>CS Assistant · answers from the Pawkit knowledge base</p></div>
    <div class="sp"></div>
    <button class="ghost" id="newChat" type="button">New chat</button>
  </header>
  <main id="log" hidden aria-live="polite"></main>
  <form class="ask" id="ask" hidden>
    <textarea id="q" rows="1" placeholder="Paste the customer's message or ask about an SOP…" aria-label="Your question"></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
</div>

<script>
// The Apps Script web app (apps-script/pawkit/Pawkit.gs). Filled in at deploy time.
var API = 'https://script.google.com/macros/s/AKfycbycuB8e_y5GGGYmZQWD-WEj3tSQUlUUXN9r3n_4MMBP_K1vNkYNIG4l1o8I90nQ9bWK/exec';
var KEY = 'pawkit-cs-session';
var EXAMPLES = [
  'Customer: "My cat hasn\'t eaten since yesterday and is hiding. Can a vet come today?"',
  'How much is full grooming for a 12 kg dog, and what surcharges apply?',
  'Owner wants subcut fluids at home but the pet has never seen a Pawkit vet. What do I need?',
  'Customer is 20 minutes late letting the groomer in. What is the policy?',
  'What CRM booking status do I set after the customer pays?'
];
var $ = function (id) { return document.getElementById(id); };
var chat = [], busy = false, session = null;
try { session = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
if (session && !(session.until > Date.now())) session = null;

function call(body) {
  // text/plain keeps this a "simple" request: no CORS preflight, which Apps Script cannot answer.
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); });
}
function show(signedIn) {
  $('gate').hidden = signedIn; $('top').hidden = $('log').hidden = $('ask').hidden = !signedIn;
  if (signedIn) { if (!chat.length) hello(); $('q').focus(); } else { $('pass').focus(); }
}
function signOut(msg) { session = null; try { localStorage.removeItem(KEY); } catch (e) {} $('gateErr').textContent = msg || ''; show(false); }

$('gateForm').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var btn = $('gateBtn'); btn.disabled = true; btn.textContent = 'Checking…'; $('gateErr').textContent = '';
  call({ a: 'login', pass: $('pass').value }).then(function (r) {
    if (!r.ok) { $('gateErr').textContent = r.error || 'Could not sign in.'; return; }
    session = { token: r.token, until: r.until };
    try { localStorage.setItem(KEY, JSON.stringify(session)); } catch (e) {}
    $('pass').value = ''; show(true); warm();
  }).catch(function () { $('gateErr').textContent = 'No connection. Try again.'; })
    .then(function () { btn.disabled = false; btn.textContent = 'Enter'; });
});

// Pre-load the knowledge base on Claude's side so the first real answer is fast.
function warm() { if (session) call({ a: 'warm', token: session.token }).catch(function () {}); }

function hello() {
  var log = $('log'); log.innerHTML = '';
  var d = document.createElement('div'); d.className = 'hello';
  d.innerHTML = '<h2>How can I help with this case?</h2><p>Paste the customer\'s message, or ask about a price, policy or process.</p><div class="chips"></div>';
  EXAMPLES.forEach(function (t) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = t;
    b.addEventListener('click', function () { ask(t); });
    d.querySelector('.chips').appendChild(b);
  });
  log.appendChild(d);
}
$('newChat').addEventListener('click', function () { if (busy) return; chat = []; hello(); $('q').focus(); });

function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>').replace(/(^|\W)_([^_\n]+)_(?=\W|$)/g, '$1<em>$2</em>');
  return s.replace(/`([^`]+)`/g, '<code>$1</code>');
}
// Small Markdown renderer: paragraphs, numbered and bulleted lists, tables, bold, links.
function md(text) {
  var out = [], lines = text.split('\n'), i = 0, list = null, para = [];
  function flushP() { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } }
  function flushL() { if (list) { out.push('</' + list + '>'); list = null; } }
  for (; i < lines.length; i++) {
    var l = lines[i], m;
    if (/^\s*\|.*\|\s*$/.test(l)) {
      flushP(); flushL(); var rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(lines[i]); i++; } i--;
      var html = '<table>';
      rows.forEach(function (r, n) {
        if (/^\s*\|[\s:|-]+\|\s*$/.test(r)) return;
        var cells = r.trim().replace(/^\||\|$/g, '').split('|'), tag = n === 0 ? 'th' : 'td';
        html += '<tr>' + cells.map(function (c) { return '<' + tag + '>' + inline(c.trim()) + '</' + tag + '>'; }).join('') + '</tr>';
      });
      out.push(html + '</table>');
    } else if ((m = l.match(/^\s*(\d+)[.)]\s+(.*)/))) { flushP(); if (list !== 'ol') { flushL(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inline(m[2]) + '</li>'); }
    else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { flushP(); if (list !== 'ul') { flushL(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inline(m[1]) + '</li>'); }
    else if ((m = l.match(/^#{1,4}\s+(.*)/))) { flushP(); flushL(); out.push('<p><strong>' + inline(m[1]) + '</strong></p>'); }
    else if (!l.trim()) { flushP(); flushL(); }
    else { flushL(); para.push(l); }
  }
  flushP(); flushL();
  return out.join('');
}

function add(cls, html) {
  var d = document.createElement('div'); d.className = 'msg ' + cls; d.innerHTML = html;
  var log = $('log'), h = log.querySelector('.hello'); if (h) h.remove();
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function renderAnswer(r, secs) {
  var text = r.answer || '', html = '';
  if (r.notice) html += '<div class="notice">' + esc(r.notice) + '</div>';
  // Lift the customer reply into its own copyable box.
  var m = text.match(/\*\*Reply to customer:?\*\*:?\s*([\s\S]*)$/i);
  if (m) {
    var reply = m[1].trim().replace(/^>\s?/gm, '').replace(/^["“]|["”]$/g, '');
    html += md(text.slice(0, m.index).trim()) + '<div class="reply"><div class="rh"><span>Reply to customer</span><button type="button" class="copy">Copy</button></div><div class="rb"></div></div>';
  } else html += md(text);
  var meta = '<span>' + secs + ' s</span>';
  (r.sources || []).forEach(function (s) { meta += '<a href="' + esc(s.url) + '" target="_blank" rel="noopener" title="' + esc(s.manual) + '">' + esc(s.title) + '</a>'; });
  html += '<div class="meta">' + meta + '</div>';
  var d = add('bot', html);
  if (m) {
    d.querySelector('.rb').textContent = reply;
    var btn = d.querySelector('.copy');
    btn.addEventListener('click', function () {
      navigator.clipboard.writeText(reply).then(function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1500); });
    });
  }
  $('log').scrollTop = d.offsetTop - 12;
}

function ask(q) {
  q = (q || '').trim(); if (!q || busy) return;
  busy = true; $('send').disabled = true; $('q').value = ''; grow();
  add('user', esc(q));
  var t0 = Date.now(), wait = add('bot', '<div class="typing"><span class="dots"><span></span><span></span><span></span></span><span class="t">Checking the SOPs…</span></div>');
  var tick = setInterval(function () { wait.querySelector('.t').textContent = 'Checking the SOPs… ' + Math.round((Date.now() - t0) / 1000) + ' s'; }, 1000);
  call({ a: 'ask', token: session && session.token, q: q, history: chat }).then(function (r) {
    wait.remove();
    if (r.relogin) { signOut(r.error); return; }
    if (!r.ok) { add('bot', '<div class="notice">' + esc(r.error || 'Something went wrong.') + '</div>'); return; }
    renderAnswer(r, ((Date.now() - t0) / 1000).toFixed(1));
    chat.push({ role: 'user', content: q }, { role: 'assistant', content: r.answer });
    chat = chat.slice(-6);
  }).catch(function () {
    wait.remove(); add('bot', '<div class="notice">No connection. Check your internet and send again.</div>');
  }).then(function () { clearInterval(tick); busy = false; $('send').disabled = false; $('q').focus(); });
}
function grow() { var t = $('q'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 2, 180) + 'px'; }
$('q').addEventListener('input', grow);
$('q').addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); ask($('q').value); } });
$('ask').addEventListener('submit', function (ev) { ev.preventDefault(); ask($('q').value); });

show(!!session); if (session) warm();
</script>
</body>
</html>
