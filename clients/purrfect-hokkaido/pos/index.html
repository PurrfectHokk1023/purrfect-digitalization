<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PH Point of Sale</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#122565">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="PH Point of Sale">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Montserrat:wght@400;500;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Brand colours from the Purrfect Hokkaido logo (Vince, 3 Nov): navy bar, green actions, teal accents, orange highlights */
:root{--green:#448F18;--green-d:#2F6A10;--bar:#122565;--navy:#122565;--teal:#108092;--orange:#EA6010;--bg:#E8E8E8;--card:#fff;--ink:#1A2A44;--muted:#5B6578;--line:#D5D8E0;--red:#D0480A;
  --display:Fredoka,ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;color-scheme:light}
h1,h2,.btn,.tile .nm,.big,.stepper output,.day,.tools select,.login h2,.rrow .no,.rrow .amt,.sum .tot,.line b,.role{font-family:var(--display)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.4 Montserrat,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.app{display:grid;grid-template-columns:1fr minmax(320px,32%);height:100%}
.bar{height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;padding-left:max(16px,env(safe-area-inset-left));background:var(--bar);color:#fff;box-shadow:0 2px 4px rgb(0 0 0/.2);position:relative;z-index:2}
.bar h1{font-weight:600;font-size:22px;letter-spacing:.01em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar img{height:34px;width:34px;border-radius:8px;background:#fff;padding:2px}
.bar .ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.bar .ib:active{background:rgb(255 255 255/.2)}
.bar svg{width:24px;height:24px;fill:#fff}
.left{display:flex;flex-direction:column;min-width:0;min-height:0}
.tools{display:flex;gap:8px;align-items:center;padding:10px 16px;padding-left:max(16px,env(safe-area-inset-left));background:var(--card);border-bottom:1px solid var(--line)}
.tools select,.tools input{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;min-width:0}
.tools select{flex:0 1 220px}.tools input{flex:1}
.grid{flex:1;overflow:auto;padding:12px 16px;padding-left:max(16px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));grid-auto-rows:132px;gap:10px;align-content:start}
.tile{position:relative;height:100%;border-radius:4px;overflow:hidden;background:var(--c,#9E9E9E);box-shadow:0 1px 2px rgb(0 0 0/.2);text-align:left;display:flex;flex-direction:column;justify-content:flex-end}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .nm{position:relative;background:rgb(18 37 101/.78);color:#fff;font-size:14px;font-weight:600;line-height:1.2;padding:6px 7px 5px;display:grid;gap:1px}
.tile .nm small{font-weight:400;opacity:.9;font-size:12px}
.tile.plain .nm{background:rgb(0 0 0/.18)}
.tile:active{transform:scale(.97)}
.tile .q{position:absolute;top:6px;right:6px;min-width:24px;height:24px;border-radius:12px;background:var(--orange);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;padding:0 6px;box-shadow:0 1px 3px rgb(0 0 0/.3)}
.tile .st{position:absolute;top:6px;left:6px;border-radius:10px;padding:1px 7px;font:700 11px var(--display);color:#fff;background:var(--orange);box-shadow:0 1px 3px rgb(0 0 0/.3)}
.tile .st.out{background:var(--red)}
.tile.out img{filter:grayscale(.7);opacity:.75}
.ib.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.empty{grid-column:1/-1;color:var(--muted);padding:24px;text-align:center}
.right{display:flex;flex-direction:column;background:var(--card);border-left:1px solid var(--line);min-height:0}
.right .bar{background:var(--card);color:var(--navy);box-shadow:0 1px 0 var(--line)}
.right .bar svg{fill:var(--muted)}
.right .bar .ib:active{background:#eee}
.lines{flex:1;overflow:auto}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.line:active{background:#f5f5f5}
.line b{font-weight:400}.line .x{color:var(--muted)}
.line .amt{text-align:right;font-variant-numeric:tabular-nums}
.line .d{grid-column:1/-1;color:var(--green-d);font-size:13px}
.line .d s{color:var(--muted)}
.none{color:var(--muted);text-align:center;padding:48px 16px}
.sum{border-top:1px solid var(--line);padding:10px 16px;display:grid;gap:4px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between}
.sum .disc{color:var(--green-d)}
.sum .tot{font-size:18px;font-weight:700;padding-top:4px}
.acts{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));padding-right:max(16px,env(safe-area-inset-right))}
.btn{height:52px;border-radius:8px;font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.04em;padding:0 16px}
.btn.g{background:var(--green);color:#fff;box-shadow:0 2px 3px rgb(0 0 0/.2)}
.btn.g:disabled{background:#BDBDBD;box-shadow:none}
.btn.o{border:1px solid var(--line);color:var(--green-d);background:#fff}
.btn.o.on{background:#E8F5E9;border-color:var(--green)}
.charge{font-size:18px}
/* sheets */
.veil{position:fixed;inset:0;background:rgb(0 0 0/.45);z-index:10;display:grid;place-items:center;padding:16px}
.sheet{background:#fff;border-radius:6px;width:min(480px,100%);max-height:calc(100% - 16px);overflow:auto;box-shadow:0 10px 30px rgb(0 0 0/.35)}
.sheet header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header h2{flex:1;font-size:18px;font-weight:500}
.sheet .bd{padding:16px;display:grid;gap:14px}
.sheet label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.sheet input,.sheet select{font:inherit;font-size:17px;color:var(--ink);padding:10px;border:1px solid var(--line);border-radius:4px;width:100%}
.stepper{display:flex;align-items:center;gap:12px;justify-content:center}
.stepper button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);font-size:26px;color:var(--green-d)}
.stepper output{font-size:28px;font-weight:500;min-width:56px;text-align:center}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:4px;font-size:16px;color:var(--ink)}
.tog input{width:22px;height:22px;accent-color:var(--green)}
.big{font-size:40px;font-weight:500;text-align:center;font-variant-numeric:tabular-nums}
.big small{display:block;font-size:14px;color:var(--muted);font-weight:400}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{height:44px;border:1px solid var(--line);border-radius:4px;font-weight:500;font-variant-numeric:tabular-nums}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pays .btn{height:60px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.loycam{width:100%;aspect-ratio:4/3;object-fit:cover;background:#111;border-radius:6px}
.loycard{border:2px solid var(--green);border-radius:8px;padding:12px;display:grid;gap:6px}
.loycard b.nm{font-size:19px}
.loydots{display:flex;gap:5px;flex-wrap:wrap}
.loydots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.loydots i.on{background:var(--green);border-color:var(--green)}
.loyready{background:#fff4c2;border-radius:6px;padding:8px 10px;font-weight:600}
.note{font-size:13px;color:var(--muted)}
.day{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:15px;color:var(--teal);padding:10px 2px 4px;border-bottom:2px solid #E8F5E9;position:sticky;top:-16px;background:#fff}
.day span:last-child{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.rrow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;padding:10px 2px;border-bottom:1px solid var(--line)}
.rrow:active{background:#f5f5f5}
.rrow .tm{color:var(--muted);font-variant-numeric:tabular-nums;min-width:62px}
.rrow .no{font-weight:500}.rrow .no small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.rrow .amt{font-weight:500;font-variant-numeric:tabular-nums}
.rlist{display:grid}
.rprev{font:12px/1.35 'Roboto Mono',monospace;white-space:pre-wrap;background:#FAFAFA;border:1px solid var(--line);border-radius:4px;padding:10px;overflow:auto;max-height:50vh}
.warn{color:var(--red);font-size:14px}
.login{position:fixed;inset:0;z-index:30;background:linear-gradient(160deg,#122565,#108092);display:grid;place-items:center;padding:16px}
.login form{background:#fff;border-radius:8px;width:min(380px,100%);padding:24px 20px;display:grid;gap:14px;box-shadow:0 10px 30px rgb(0 0 0/.3)}
.login img{width:84px;height:84px;border-radius:18px;justify-self:center}
.login h2{text-align:center;font-size:24px;font-weight:700;color:var(--navy)}
.login p.sub{text-align:center;color:var(--muted);font-size:13px;margin-top:-8px}
.login label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.login input{font:inherit;font-size:17px;padding:11px;border:1px solid var(--line);border-radius:4px;color:var(--ink)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row3 .btn{font-size:13px;padding:0 8px}
body[data-role="agent"] .admin-only{display:none!important}
.cam{position:fixed;right:max(16px,env(safe-area-inset-right));top:64px;width:min(360px,calc(100vw - 32px));z-index:9;background:#0b1430;color:#fff;border-radius:12px;box-shadow:0 8px 28px rgb(0 0 0/.35);overflow:hidden;display:flex;flex-direction:column}
.cam.big{inset:64px 16px 16px;width:auto}
.right>.cam{position:relative;top:auto;right:auto;width:auto;margin:8px 8px 0;flex:none;box-shadow:none}
.right>.cam.big{position:fixed;inset:64px 16px 16px;margin:0;box-shadow:0 8px 28px rgb(0 0 0/.35)}
.cam.min>:not(header){display:none}
@media(max-width:760px){.cam{top:124px;width:min(260px,calc(100vw - 32px));z-index:4}.cam.big{z-index:9}}
.cam header{display:flex;align-items:center;gap:2px;padding:4px 4px 4px 12px;font-weight:600;font-size:14px}
.cam header>span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cam header button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}.cam header button:active{background:rgb(255 255 255/.2)}
.cam header svg{width:20px;height:20px;fill:#fff}
.cam .rec{flex:none;color:#ff6b6b;font-variant-numeric:tabular-nums;font-size:13px;margin-right:4px}
.cam iframe,.cam video{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000;object-fit:contain}.cam.big iframe,.cam.big video{flex:1;aspect-ratio:auto;min-height:0}
.cam .msg{padding:16px 14px;font-size:14px;line-height:1.45;background:#000}
.cam .msg button{margin-top:10px;padding:6px 14px;border-radius:6px;background:#fff;color:#0b1430;font-weight:600}
.cam footer{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;font-size:12px}
.cam footer span{flex:1;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cam footer button{padding:6px 12px;border-radius:16px;font-weight:600;font-size:13px;background:rgb(255 255 255/.14)}
.cam footer button.on{background:#d0480a}
.cam footer button.dot::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff4d4d;margin-right:6px;vertical-align:1px}
.role{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:10px;background:rgb(255 255 255/.25);margin-left:6px;vertical-align:middle}
.ib.onl{position:relative}.ib.onl.ring{animation:ring .5s ease-in-out 6}
@keyframes ring{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.obadge{position:absolute;top:2px;right:0;min-width:18px;height:18px;border-radius:9px;background:#F44336;color:#fff;font:700 11px/18px sans-serif;text-align:center;padding:0 4px}
.obadge[hidden]{display:none}
.oo{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#fff}
.oo.New{border-color:#F44336;box-shadow:0 0 0 2px rgb(244 67 54/.15)}
.oo .oh{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:17px}
.oo .ot{display:inline-block;margin-top:4px;font-weight:700;font-size:15px;color:#fff;background:#122565;border-radius:99px;padding:3px 10px}
.oo .oi{margin-top:6px;white-space:pre-line;font-size:15px;line-height:1.35}
.oo .os{font-size:12px;font-weight:700;text-transform:uppercase;border-radius:99px;padding:3px 8px;background:#fde7d9;color:#7a2d00;white-space:nowrap}
.oo .os.Preparing{background:#fff2cc;color:#6b4e00}.oo .os.Ready{background:#d9ead3;color:#1d5a0c}
.oo .ob{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.oo .ob .btn{height:46px;font-size:14px;padding:0 6px}
.oo .ob .btn.wide{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#323232;color:#fff;padding:12px 18px;border-radius:4px;z-index:20;font-size:14px;max-width:calc(100% - 32px)}
.mobile-bar{display:none}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .right{position:fixed;inset:0;z-index:5;transform:translateY(100%);transition:transform .2s}
  .right.open{transform:none}
  .mobile-bar{display:flex;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
  .mobile-bar .btn{flex:1}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));grid-auto-rows:112px}
}
/* browser-print receipt: zero page margins leave no room for the browser's date / title / URL lines */
@page{margin:0}
#rc{display:none}
@media print{
  html,body{background:#fff;overflow:visible;margin:0;padding:0;height:auto}
  .app,.veil,.toast,.mobile-bar,.cam{display:none!important}
  #rc{display:block;box-sizing:border-box;width:var(--paper,80mm);padding:3mm 3mm 0;font:var(--rcfont,11px)/1.3 'Roboto Mono',monospace;color:#000;white-space:pre-wrap}
  #rc img{display:block;width:60%;margin:0 auto 2mm;filter:grayscale(1) contrast(1.2)}
}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form id="lgForm" autocomplete="on">
    <img src="icons/icon-192.png" alt="">
    <h2>PH Point of Sale</h2>
    <p class="sub">Purrfect Hokkaido · log in to start selling</p>
    <label>Username <input id="lgUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Password <input id="lgPass" name="password" type="password" autocomplete="current-password" required></label>
    <p class="warn" id="lgErr"></p>
    <button class="btn g" id="lgBtn" type="submit">Log in</button>
  </form>
</div>
<div class="app">
  <section class="left">
    <div class="bar">
      <img src="img/cat-mark.webp" alt="">
      <h1>PH Point of Sale<span class="role" id="roleTag"></span></h1>
      <button class="ib" id="syncBtn" aria-label="Sync everything" title="Sync with Loyverse"><svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6a6 6 0 0 1 5.65 8.03l1.46 1.46A8 8 0 0 0 12 4zm0 14a6 6 0 0 1-5.65-8.03L4.89 8.51A8 8 0 0 0 12 20v3l4-4-4-4z"/></svg></button>
      <button class="ib admin-only" id="manageBtn" aria-label="Manage items" title="Manage items"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75zM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z"/></svg></button>
      <a class="ib admin-only" href="report.html" target="_blank" rel="noopener" aria-label="Open the Sales Report" title="Sales Report"><svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg></a>
      <button class="ib onl" id="onlineBtn" aria-label="Online orders" title="Online orders"><svg viewBox="0 0 24 24"><path d="M18 6h-2a4 4 0 0 0-8 0H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm-6-2a2 2 0 0 1 2 2h-4a2 2 0 0 1 2-2zm6 16H6V8h2v2h2V8h4v2h2V8h2z"/></svg><span class="obadge" id="obadge" hidden></span></button>
      <button class="ib" id="loyBtn" aria-label="Loyalty card: scan for a stamp" title="Loyalty card"><svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zm2 2v3h3V5zm9-2h7v7h-7zm2 2v3h3V5zM3 14h7v7H3zm2 2v3h3v-3zm9-2h2v2h-2zm2 2h2v2h-2zm2-2h3v2h-3zm-4 4h2v3h-2zm4 0h3v3h-3zm-2 2h2v1h-2z"/></svg></button>
      <button class="ib" id="camBtn" aria-label="Café camera" title="Café camera" hidden><svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11z"/></svg></button>
      <button class="ib" id="printerBtn" aria-label="Printers" title="Printers"><svg viewBox="0 0 24 24"><path d="M19 8H5a3 3 0 0 0-3 3v6h4v4h12v-4h4v-6a3 3 0 0 0-3-3zm-3 11H8v-5h8zm3-7a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm-1-9H6v4h12z"/></svg></button>
      <button class="ib" id="rcptBtn" aria-label="Receipts, last 30 days" title="Receipts"><svg viewBox="0 0 24 24"><path d="M18 17H6v-2h12zm0-4H6v-2h12zm0-4H6V7h12zM3 22l1.5-1.5L6 22l1.5-1.5L9 22l1.5-1.5L12 22l1.5-1.5L15 22l1.5-1.5L18 22l1.5-1.5L21 22V2l-1.5 1.5L18 2l-1.5 1.5L15 2l-1.5 1.5L12 2l-1.5 1.5L9 2 7.5 3.5 6 2 4.5 3.5 3 2z"/></svg></button>
      <button class="ib" id="setBtn" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1L11 21h4l.4-2.7a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z"/></svg></button>
    </div>
    <div class="tools">
      <select id="cat" aria-label="Category"></select>
      <input id="q" type="search" placeholder="Search items" aria-label="Search items" autocomplete="off">
    </div>
    <div class="grid" id="grid"></div>
    <div class="mobile-bar"><button class="btn g charge" id="openTicket">Ticket · <span id="mTot">₱0.00</span></button></div>
  </section>
  <section class="right" id="right">
    <div class="bar">

const $ = s => document.querySelector(s);
const store = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }};
const peso = n => '₱' + (Math.round(n * 100) / 100).toLocaleString('en-PH', {minimumFractionDigits: 2, maximumFractionDigits: 2});

const LV_COLORS = {GREY: '#9E9E9E', RED: '#F44336', PINK: '#E91E63', ORANGE: '#FF9800', YELLOW: '#FBC02D', GREEN: '#4CAF50', BLUE: '#2196F3', PURPLE: '#9C27B0', LIME: '#CDDC39'};
const tileColor = (name, cat, lv) => name.startsWith('(G)') ? '#FF9800' : name.startsWith('(M)') ? '#CDDC39' : (DATA.catColor[cat] || LV_COLORS[lv] || '#9E9E9E');

// Items = Loyverse list (built nightly, or pulled live with "Update from Loyverse") + the edits saved in
// the POS Items sheet tab. Edits win. Every item is keyed by its Loyverse name; added items by "new:...".
let ITEMS = [], CATS = [], byKey = {};
function catalogue() {
  const live = jget('pos-lv');
  let base = DATA.items.map(i => ({key: i.name, name: i.name, cat: i.cat, price: i.price, color: i.color, photo: PHOTOS[i.name] || ''}));
  if (live && Array.isArray(live.items) && live.items.length) {
    base = live.items.filter(i => i.name !== 'SR/PWD').map(i => ({key: i.name, name: i.name, cat: i.cat || 'Other', price: Number(i.price) || 0,
      color: tileColor(i.name, i.cat || 'Other', i.color), photo: PHOTOS[i.name] || i.image || ''}));
  }
  const edits = jget('pos-edits') || [], em = Object.fromEntries(edits.map(e => [e.key, e]));

// ---- receipt history (this device, last 30 days) ---------------------------------------------------------
const HIST = 'pos-history', KEEP_DAYS = 30;
const pack = s => ({no: s.no, at: new Date(s.at).toISOString(), type: s.type, tendered: s.tendered, sub: s.sub, disc: s.disc, total: s.total,
  change: s.change, qty: s.qty, cashier: s.cashier || '', senior: s.senior && s.senior.id ? s.senior : undefined,
  lines: s.lines.map(l => [l.name, l.price, l.qty, l.disc ? 1 : 0, l.discQty || 0, l.key || ''])});   // key = Loyverse item name (Sales Report, 7 Nov)
const unpack = h => ({...h, at: new Date(h.at), senior: h.senior || {id: '', name: ''}, lines: h.lines.map(([name, price, qty, disc, dq]) => ({name, price, qty, disc: !!disc, discQty: dq || (disc ? qty : 0)}))});
function loadHistory() {
  let h = [];
  try { h = JSON.parse(store.get(HIST) || '[]'); } catch (e) { h = []; }
  const cutoff = Date.now() - KEEP_DAYS * 864e5;
  return h.filter(x => Date.parse(x.at) >= cutoff);
}
function saveHistory(sale) {
  let h = loadHistory(); h.push(pack(sale));
  for (let i = 0; i < 6; i++) {
    try { localStorage.setItem(HIST, JSON.stringify(h)); return; }
    catch (e) { h = h.slice(Math.ceil(h.length * 0.2)); }   // storage full: drop the oldest fifth and retry
  }
}
(() => {   // one-time move of the old single "last receipt" into the history
  const old = store.get('pos-last');
  if (old) { try { const s = JSON.parse(old); if (!loadHistory().some(x => x.no === s.no)) saveHistory(s); } catch (e) {} try { localStorage.removeItem('pos-last'); } catch (e) {} }
})();

// Sales sync (6 Nov): every finished sale also goes to the POS Sales tab so the Sales Report shows the day's
// sales live. Sales wait in a queue on this device until the server confirms them (offline-safe, retried).
const SYNCQ = 'pos-sync-q', DEV = store.get('pos-dev') || (() => { const d = Math.random().toString(36).slice(2, 8); store.set('pos-dev', d); return d; })();
const syncQ = () => { try { return JSON.parse(store.get(SYNCQ) || '[]'); } catch (e) { return []; } };
const setQ = q => { try { localStorage.setItem(SYNCQ, JSON.stringify(q)); } catch (e) {} };
let syncing = false;
function queueSale(packed) { const q = syncQ(); if (!q.some(x => x.no === packed.no)) { q.push(packed); setQ(q); } flushSales(); }
function flushSales() {
  const q = syncQ();
  if (syncing || !q.length || !session || !session.token) return;
  syncing = true;
  api.post({pos: 'sales', token: session.token, dev: DEV, sales: q.slice(0, 100)}).then(r => {
    if (r && r.ok) { const ok = new Set(r.saved || []); setQ(syncQ().filter(x => !ok.has(x.no))); }
  }).catch(() => {}).finally(() => { syncing = false; if (syncQ().length && navigator.onLine) setTimeout(flushSales, 60000); });
}
(() => {   // first run after this update: queue today's receipts already on this device
  if (store.get('pos-sync-start')) return;
  const today = new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  store.set('pos-sync-start', today);
  loadHistory().filter(x => new Date(Date.parse(x.at) + 8 * 3600e3).toISOString().slice(0, 10) === today).forEach(x => { const q = syncQ(); if (!q.some(y => y.no === x.no)) { q.push(x); setQ(q); } });
})();
addEventListener('online', flushSales);
setInterval(flushSales, 120000);

function markHistory(no, patch) {

// ---- receipt ----------------------------------------------------------------------------------------
const ascii = s => String(s).replace(/₱/g, 'P').replace(/×/g, 'x').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—−]/g, '-').replace(/·/g, '-')
  .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7e\n]/g, '');
const lr = (l, r, w) => { l = ascii(l); r = ascii(r); return l.slice(0, w - r.length - 1).padEnd(w - r.length) + r; };
const ctr = (s, w) => { s = ascii(s).slice(0, w); return ' '.repeat(Math.floor((w - s.length) / 2)) + s; };
const money = n => 'P' + (Math.round(n * 100) / 100).toLocaleString('en-PH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const wrapw = (s, w) => { const out = []; let cur = ''; for (const word of ascii(s).split(' ')) { if ((cur + (cur ? ' ' : '') + word).length <= w) cur += (cur ? ' ' : '') + word; else { if (cur) out.push(cur); cur = word.slice(0, w); } } out.push(cur); return out; };

function receiptText(s, w) {
  const rule = '-'.repeat(w), when = s.at instanceof Date ? s.at : new Date(s.at);
  const dt = when.toLocaleString('en-PH', {timeZone: 'Asia/Manila', year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'});
  const L = [];
  L.push(...SHOP.lines.map(x => ctr(x, w)), '', lr('Receipt #' + s.no, '', w), dt);
  if (s.cashier) L.push('Cashier: ' + s.cashier);
  L.push(rule);
  for (const l of s.lines) {
    const amt = l.price * l.qty;
    L.push(...wrapw(l.name, w));
    L.push(lr('  ' + l.qty + ' x ' + money(l.price), money(amt), w));
    if (l.disc) L.push(lr('  Sr/PWD 20% x' + (l.discQty || l.qty), '-' + money(l.price * (l.discQty || l.qty) * DISC.rate), w));
  }
  L.push(rule);
  if (s.disc) { L.push(lr('Subtotal', money(s.sub), w)); L.push(lr('Sr/PWD Discount 20%', '-' + money(s.disc), w)); }
  L.push('@@TOTAL@@' + lr('TOTAL', money(s.total), w));
  L.push(lr(s.type === 'QR Payments' ? 'GCash / QR' : s.type, money(s.tendered), w));
  if (s.type === 'Cash') L.push(lr('Change', money(s.change), w));
  if (s.disc) {
    L.push(rule, 'SC/PWD ID: ' + ascii(s.senior.id || '_______________'), 'Name: ' + ascii(s.senior.name || '___________________'), '', 'Signature: _____________________');
  }
  L.push(rule, ctr('Thank you! See you again', w), ctr('This is not an official receipt', w));
  return L;
}

function escpos(s, w) {
  const ESC = '\x1b', GS = '\x1d';
  const lines = receiptText(s, w);
  let t = ESC + 'a0';
  for (const l of lines) t += l.startsWith('@@TOTAL@@') ? GS + '!\x01' + ESC + 'E1' + l.slice(9) + ESC + 'E0' + GS + '!\x00' + '\n' : l + '\n';
  t += '\n' + GS + 'V\x42\x00';   // one blank line after "not an official receipt", then cut (Vince, 3 Nov)
  const head = new TextEncoder().encode(ESC + '@'), logo = Uint8Array.from(atob(LOGO.raster[String(w)] || LOGO.raster['48']), c => c.charCodeAt(0));
  const body = new TextEncoder().encode('\n' + t);   // pure ASCII, so UTF-8 bytes = the printer's bytes
  const all = new Uint8Array(head.length + logo.length + body.length);
  all.set(head, 0); all.set(logo, head.length); all.set(body, head.length + logo.length);
  return all;
}

function send(bytes) {
  return new Promise((resolve, reject) => {
    let ws;
    try { ws = new WebSocket(WS); } catch (e) { return reject(e); }
    ws.binaryType = 'arraybuffer';
    const t = setTimeout(() => { try { ws.close(); } catch (e) {} reject(new Error('timeout')); }, 4000);
    ws.onopen = () => { ws.send(bytes); setTimeout(() => { clearTimeout(t); ws.close(1000, 'done'); resolve(); }, 300); };
    ws.onerror = () => { clearTimeout(t); reject(new Error('no server')); };
  });
}

function browserPrint(s) {
  const w = settings.paper === '32' ? 32 : 42;
  browserPrintText(receiptText(s, w).map(l => l.replace('@@TOTAL@@', '')).join('\n'), true);
}
function browserPrintText(text, withLogo) {
  const paper = settings.paper === '32' ? 58 : 80;
  document.documentElement.style.setProperty('--paper', paper + 'mm');
  document.documentElement.style.setProperty('--rcfont', paper === 58 ? '10px' : '11px');   // 32 / 42 columns fit
  const rc = $('#rc');
  const img = withLogo ? el('img', {src: LOGO.img, alt: 'Purrfect Hokkaido'}) : null;
  rc.replaceChildren(...(img ? [img] : []), el('div', {textContent: text + '\n '}));
  // The page is exactly as long as the receipt, so the paper stops right after the last line (Vince: save paper).
  const go = () => {
    rc.style.cssText = 'display:block;position:absolute;visibility:hidden;left:0;top:0;box-sizing:border-box;width:' + paper + 'mm;padding:3mm 3mm 0;'
      + 'font:' + (paper === 58 ? '10px' : '11px') + '/1.3 "Roboto Mono",monospace;white-space:pre-wrap';
    if (img) img.style.cssText = 'display:block;width:60%;margin:0 auto 2mm';
    const mm = Math.ceil(rc.scrollHeight * 25.4 / 96) + 1;
    rc.removeAttribute('style'); if (img) img.removeAttribute('style');
    let st = document.getElementById('pagesize');
    if (!st) { st = document.createElement('style'); st.id = 'pagesize'; document.head.append(st); }
    st.textContent = '@page{size:' + paper + 'mm ' + mm + 'mm;margin:0}';
    window.print();
  };
  if (img && !img.complete) { img.onload = go; return; }
  go();
}

function toast(msg) { const t = el('div', {className: 'toast', textContent: msg}); document.body.append(t); setTimeout(() => t.remove(), 3200); }

// ---- direct Bluetooth printing (Web Bluetooth, Chrome on Android / desktop; BLE printers) ---------------
// Classic-Bluetooth-only printers do not show up here: those keep printing through RawBT.
const BT_SERVICES = ['000018f0-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', '49535343-fe7d-4ae5-8fa9-9fafd205e455',
  '0000ff00-0000-1000-8000-00805f9b34fb', '0000ffe0-0000-1000-8000-00805f9b34fb', '0000fee7-0000-1000-8000-00805f9b34fb', '0000af30-0000-1000-8000-00805f9b34fb'];
const bt = {
  dev: null, ch: null,
  supported: () => !!(navigator.bluetooth && navigator.bluetooth.requestDevice),
  known() { return !!(this.dev || store.get('pos-bt-id')); },
  name() { return (this.dev && this.dev.name) || store.get('pos-bt-name') || 'Bluetooth printer'; },
  async pick() {
    if (!this.supported()) throw new Error('this browser cannot use Bluetooth. Use Chrome on Android');
    const d = await navigator.bluetooth.requestDevice({acceptAllDevices: true, optionalServices: BT_SERVICES});
    this.dev = d; this.ch = null;
    await this.open();
    store.set('pos-bt-id', d.id); store.set('pos-bt-name', d.name || 'Bluetooth printer');
    return this.name();
  },
  async find() {
    if (this.dev) return this.dev;
    const id = store.get('pos-bt-id');
    if (id && navigator.bluetooth && navigator.bluetooth.getDevices) this.dev = (await navigator.bluetooth.getDevices()).find(d => d.id === id) || null;
    if (!this.dev) throw new Error('no printer connected yet');
    return this.dev;
  },
  async open() {
    const d = await this.find();
    if (this.ch && d.gatt.connected) return this.ch;
    const server = await d.gatt.connect();
    for (const svc of await server.getPrimaryServices()) {
      for (const c of await svc.getCharacteristics()) {
        if (c.properties.writeWithoutResponse || c.properties.write) { this.ch = c; return c; }
      }
    }
    throw new Error('this device has no printing channel');
  },
  async write(bytes) {
    const c = await this.open(), size = 180;   // small packets: many printers accept no more per write
    for (let i = 0; i < bytes.length; i += size) {
      const part = bytes.slice(i, i + size);
      if (c.properties.writeWithoutResponse && c.writeValueWithoutResponse) { await c.writeValueWithoutResponse(part); await new Promise(r => setTimeout(r, 12)); }
      else await c.writeValue(part);
    }
  },
  forget() {
    try { if (this.dev && this.dev.gatt.connected) this.dev.gatt.disconnect(); } catch (e) {}
    this.dev = null; this.ch = null;
    try { localStorage.removeItem('pos-bt-id'); localStorage.removeItem('pos-bt-name'); } catch (e) {}
  },
};
if (store.get('pos-bt-id')) bt.open().catch(() => {});   // reconnect quietly to the remembered printer

async function printJob(bytesFn, browserFn, what) {
  const want = settings.printer, n = settings.copies;
  if (want === 'bt' || (want === 'auto' && bt.known())) {
    try {
      for (let i = 0; i < n; i++) await bt.write(bytesFn());
      toast(what + ' sent to ' + bt.name());
      return;
    } catch (e) {
      if (want === 'bt') { toast('Bluetooth printer: ' + e.message + '. Open Printers to connect it.'); return; }
    }
  }
  if (want === 'auto' || want === 'rawbt') {
    try {
      for (let i = 0; i < n; i++) await send(bytesFn());
      toast(what + ' sent to the printer');
      return;
    } catch (e) {
      if (want === 'rawbt') { toast('Printer app not reachable. Open Server for RawBT and try again.'); return; }
    }
  }
  browserFn();
}
const printSale = s => printJob(() => escpos(s, Number(settings.paper)), () => browserPrint(s), 'Receipt');

// ---- void / refund slip -----------------------------------------------------------------------------
function slipText(v, w) {
  const rule = '-'.repeat(w), when = d => new Date(d).toLocaleString('en-PH', {timeZone: 'Asia/Manila', year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'});
  const L = [ctr('PURRFECT HOKKAIDO', w), ctr(v.type === 'Void' ? '*** VOID ***' : '*** REFUND ***', w), '',
    'Receipt #' + v.no, 'Sold: ' + when(v.soldAt), (v.type === 'Void' ? 'Voided: ' : 'Refunded: ') + when(new Date()), rule];
  for (const l of v.lines) { L.push(...wrapw(l.name, w)); L.push(lr('  ' + l.qty + ' x ' + money(l.price), '-' + money(l.amount), w)); }
  L.push(rule, '@@TOTAL@@' + lr(v.type === 'Void' ? 'VOIDED' : 'REFUNDED', money(v.amount), w), lr('Paid by', payLabel(v.payment), w), rule);
  L.push(...wrapw('Reason: ' + v.reason, w), 'Done by: ' + roleName() + (settings.cashier ? ' (' + settings.cashier + ')' : ''), '', 'Signature: _____________________');
  return L;
}
function printSlip(v) {
  const w = Number(settings.paper) === 32 ? 32 : 42, lines = slipText(v, w);
  const bytes = () => { const ESC = '\x1b', GS = '\x1d'; let t = ESC + '@' + ESC + 'a0';
    for (const l of lines) t += l.startsWith('@@TOTAL@@') ? GS + '!\x01' + ESC + 'E1' + l.slice(9) + ESC + 'E0' + GS + '!\x00\n' : l + '\n';
    return new TextEncoder().encode(t + '\n' + GS + 'V\x42\x00'); };
  return printJob(bytes, () => browserPrintText(lines.map(l => l.replace('@@TOTAL@@', '')).join('\n'), false), (v.type === 'Void' ? 'Void' : 'Refund') + ' slip');
}

// ---- past receipts ----------------------------------------------------------------------------------
const dayKey = d => new Date(d).toLocaleDateString('en-CA', {timeZone: 'Asia/Manila'});
const dayLabel = k => new Date(k + 'T12:00:00+08:00').toLocaleDateString('en-PH', {timeZone: 'Asia/Manila', weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'});
const timeLabel = d => new Date(d).toLocaleTimeString('en-PH', {timeZone: 'Asia/Manila', hour: 'numeric', minute: '2-digit'});

              + (x.voided ? ' · VOIDED' : x.refunded ? ' · Refunded ' + peso(x.refunded) : '')})]),

const lineNet = l => r2(l.price * l.qty - (l.disc ? l.price * (l.discQty || l.qty) * DISC.rate : 0));
const VOID_REASONS = ['Wrong item rung up', 'Customer changed their mind', 'Duplicate sale', 'Item not available', 'Product problem', 'Test sale', 'Other'];

function showOne(sale) {
  const w = settings.paper === '32' ? 32 : 42;
  sheet('Receipt #' + sale.no, (bd, close) => {
    const pr = el('button', {className: 'btn g', textContent: 'Reprint'}), back = el('button', {className: 'btn o', textContent: 'Back'});
    pr.onclick = () => printSale(sale); back.onclick = close;
    const refunded = sale.refunded || 0, left = r2(sale.total - refunded);
    const status = sale.voided ? 'VOIDED' + (sale.voidReason ? ' \u00b7 ' + sale.voidReason : '') : refunded ? 'Refunded ' + peso(refunded) + (left > 0 ? ' \u00b7 ' + peso(left) + ' left' : ' (full)') : '';
    if (status) bd.append(el('p', {className: 'warn', textContent: status}));
    bd.append(el('div', {className: 'rprev', textContent: receiptText(sale, w).map(l => l.replace('@@TOTAL@@', '')).join('\n')}), el('div', {className: 'row2'}, [back, pr]));
    if (!sale.voided && left > 0) {
      const vd = el('button', {className: 'btn o', textContent: 'Void'}), rf = el('button', {className: 'btn o', textContent: 'Refund'});
      vd.disabled = refunded > 0;
      vd.onclick = () => { close(); voidOrRefund(sale, 'Void'); }; rf.onclick = () => { close(); voidOrRefund(sale, 'Refund'); };
      bd.append(el('div', {className: 'row2'}, [vd, rf]),
        el('p', {className: 'note', textContent: 'Void cancels the whole sale (for example a mistake). Refund gives money back for some or all items. Both are logged for the Sales Report and print a slip.'}));
    }
  });
}

function voidOrRefund(sale, type) {
  const refunded = sale.refunded || 0, left = r2(sale.total - refunded);
  sheet((type === 'Void' ? 'Void' : 'Refund') + ' receipt #' + sale.no, (bd, close) => {
    const done = sale.refundedQty || {};
    const picks = sale.lines.map(l => ({l, max: l.qty - (done[l.name] || 0), q: type === 'Void' ? l.qty : 0}));
    const amountOf = () => type === 'Void' ? sale.total : r2(Math.min(left, picks.reduce((a, p) => a + (p.q ? lineNet(p.l) * p.q / p.l.qty : 0), 0)));
    const amt = el('div', {className: 'big'});
    const showAmt = () => { amt.replaceChildren(peso(amountOf()), el('small', {textContent: type === 'Void' ? 'whole receipt, paid by ' + payLabel(sale.type) : 'to give back, paid by ' + payLabel(sale.type)})); };

const camWhere = text => { const w = camBox && camBox.querySelector('footer span'); if (w) w.textContent = text; };
async function recStart(stream, btn, clock, noDir) {
  const type = recType();
  if (!type) throw new Error('this browser can\'t record video');
  const ext = type.startsWith('video/mp4') ? 'mp4' : 'webm';
  const file = noDir ? null : await recFile(ext).catch(e => {
    toast('Can\'t save in ' + (camDir ? camDir.name : 'the folder') + ' (' + (e.name === 'NotFoundError' ? 'folder missing' : e.name) + '): recording to Downloads');
    return null;
  });
  if (stream !== camStream || rec) { if (file) file.w.abort(); return; }
  if (camDir && !file) camWhere('Saving to: Downloads (folder unavailable)');
  const r = {mr: new MediaRecorder(stream, {mimeType: type, videoBitsPerSecond: 2500000}), file, chunks: [], q: Promise.resolve(), t0: Date.now(), btn, clock, ext,
    name: file ? file.name : recName(ext)};
  r.mr.ondataavailable = e => {
    if (!e.data.size) return;
    if (!r.file) { r.chunks.push(e.data); return; }
    r.q = r.q.then(() => r.err || r.file.w.write(e.data)).catch(err => {   // first write error: tell, then keep recording to Downloads
      if (r.err) return; r.err = err;
      toast('Could not write to ' + r.file.dir + ' (' + (err.name || err) + '). Recording continues to Downloads.');
      camWhere('Saving to: Downloads (folder unavailable)');
      if (rec === r) { recStop(); recStart(stream, btn, clock, true).catch(() => toast('Recording stopped')); }
    });
  };
  r.mr.onerror = e => toast('Recording error: ' + ((e.error && e.error.name) || 'unknown'));
  r.mr.onstop = () => { if (rec === r) { recStop(); toast('Recording stopped unexpectedly. What was recorded has been saved.'); } recSave(r); };
  r.mr.start(1000);
  r.tick = setInterval(() => { const s = Math.floor((Date.now() - r.t0) / 1000); clock.textContent = '● ' + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }, 500);
  r.split = setTimeout(() => {   // next file; keeps Downloads mode if the folder already failed
    if (rec !== r) return;
    recStop(); btn.disabled = true;
    recStart(stream, btn, clock, !r.file).catch(() => toast('Recording stopped: could not start the next file')).finally(() => { btn.disabled = !camStream || !!motion; });
  }, CAM_SPLIT);
  rec = r; btn.textContent = 'Stop'; btn.classList.add('on'); btn.classList.remove('dot'); clock.hidden = false; clock.textContent = '● 00:00';
}
function recStop() {
  const r = rec; if (!r) return;
  rec = null; clearInterval(r.tick); clearTimeout(r.split);
  if (r.mr.state !== 'inactive') r.mr.stop();   // onstop saves, after the last chunk
  r.btn.textContent = 'Record'; r.btn.classList.remove('on'); r.btn.classList.add('dot'); r.clock.hidden = true;
}
function recSave(r) {
  if (r.saved) return; r.saved = true;
  if (r.file) {
    r.q.then(() => { if (r.err) throw r.err; return r.file.w.close(); }).then(() => { if (!motion) toast('Saved ' + r.file.name + ' in ' + r.file.dir); }, () => {
      toast('Could not finish ' + r.file.name);
      r.file.w.abort().catch(() => {}).then(() => r.file.d.removeEntry(r.file.name)).catch(() => {});   // drop the empty file
    });
    return;
  }
  if (!r.chunks.length) return;
  const blob = new Blob(r.chunks, {type: r.mr.mimeType}), a = el('a', {href: URL.createObjectURL(blob), download: r.name});
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  if (!motion) toast('Saved ' + r.name + ' to Downloads');
}
addEventListener('beforeunload', e => { if (rec) { e.preventDefault(); e.returnValue = ''; } });
addEventListener('pagehide', () => { if (rec) recStop(); });   // best effort: finish the current file when the page goes away
$('#camBtn').onclick = camOpen;   // camSync() runs after login state is read (below)

// ---- mobile ticket panel ----------------------------------------------------------------------------
$('#openTicket').onclick = () => $('#right').classList.add('open');
$('#closeTicket').onclick = () => $('#right').classList.remove('open');
const mq = matchMedia('(max-width:760px)'); const syncMq = () => { $('#closeTicket').hidden = !mq.matches; camPlace(); }; mq.addEventListener('change', syncMq); syncMq();

// ---- login (Admin / Sales Agent; checked by the web app, never in this page) ------------------------
const SESSION = 'pos-session';
let session = jget(SESSION);
const roleName = () => session && session.role === 'admin' ? 'Admin' : 'Sales Agent';
function applyRole() { document.body.dataset.role = session ? session.role : ''; $('#roleTag').textContent = session ? roleName() : ''; }
function showLogin(msg) { $('#login').hidden = false; $('#lgErr').textContent = msg || ''; setTimeout(() => ($('#lgUser').value ? $('#lgPass') : $('#lgUser')).focus(), 50); }
function logout(msg) { if (!rec) camClose(true); session = null; try { localStorage.removeItem(SESSION); } catch (e) {} applyRole(); showLogin(msg); }   // a recording keeps going under the login screen
$('#lgUser').value = store.get('pos-user') || '';
$('#lgForm').onsubmit = e => {
  e.preventDefault();
  const btn = $('#lgBtn'); btn.disabled = true; $('#lgErr').textContent = '';
  api.post({pos: 'login', user: $('#lgUser').value, pass: $('#lgPass').value}).then(r => {
    if (!r.ok) { $('#lgErr').textContent = r.error || 'Could not log in.'; return; }
    session = {role: r.role, token: r.token, until: r.until}; jset(SESSION, session); flushSales();
    store.set('pos-user', $('#lgUser').value.trim()); $('#lgPass').value = '';
    $('#login').hidden = true; applyRole(); toast('Logged in as ' + roleName()); camSync();
  }).catch(() => { $('#lgErr').textContent = 'No internet connection. Logging in needs the internet once.'; })
    .finally(() => { btn.disabled = false; });
};
if (!session || session.until < Date.now()) { session = null; showLogin(); }
else flushSales();
applyRole();
camSync();
setInterval(() => { if (session && session.until < Date.now()) logout('Your session ended. Please log in again.'); }, 60000);

// ---- manage items (Admin) ---------------------------------------------------------------------------
function handleSave(r) {
  if (r.relogin) { logout(r.error); throw new Error(r.error); }
  if (!r.ok) throw new Error(r.error || 'Could not save. Try again.');
  jset('pos-edits', r.edits); catalogue(); buildCats(); render();
  return r;
}
const lvSync = keys => api.post({pos: 'lvsync', token: session && session.token, keys}).then(r => {
  if (r.relogin) { logout(r.error); throw new Error(r.error); }
  if (r.edits) { jset('pos-edits', r.edits); catalogue(); buildCats(); render(); }
  if (!r.ok && !r.synced) throw new Error(r.error || 'Loyverse did not accept the change');
  return r;
});
const saveItems = items => api.post({pos: 'save', token: session && session.token, items}).then(handleSave);
const resetItems = keys => api.post({pos: 'reset', token: session && session.token, items: keys.map(key => ({key}))}).then(handleSave);
const lvNote = () => { const lv = jget('pos-lv');
  return (lv ? 'Items pulled from Loyverse ' + new Date(lv.at).toLocaleString('en-PH', {timeZone: 'Asia/Manila', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}) : 'Items from last night\u2019s Loyverse copy')
    + '. Changes here reach every POS device; Loyverse itself is not changed.'; };

function showManage() {
  if (!session || session.role !== 'admin') { toast('Log in as Admin to manage items'); return; }
  refreshEdits();
  sheet('Manage items', (bd) => {
    const upd = el('button', {className: 'btn o', textContent: 'Update from Loyverse'});
    const ren = el('button', {className: 'btn o', textContent: 'Rename category'});
    const addB = el('button', {className: 'btn g', textContent: 'Add item'});
    const info = el('p', {className: 'note', textContent: lvNote()});
    const q = el('input', {type: 'search', placeholder: 'Search items', autocomplete: 'off'});
    const list = el('div', {className: 'rlist'});
    const draw = () => {
      const t = q.value.trim().toLowerCase(); list.replaceChildren();
      for (const c of CATS) {
        const xs = ITEMS.filter(i => i.cat === c && (!t || (i.name + ' ' + tidy(i.name)).toLowerCase().includes(t)));
        if (!xs.length) continue;
        list.append(el('div', {className: 'day'}, [el('span', {textContent: c}), el('span', {textContent: xs.length + (xs.length === 1 ? ' item' : ' items')})]));
        for (const i of xs) {
          const b = el('button', {className: 'rrow'}, [el('span', {className: 'tm', textContent: peso(i.price)}),
            el('span', {className: 'no'}, [tidy(i.name), el('small', {textContent: [i.hidden ? 'Hidden' : '', i.added ? 'Added in POS' : i.edited ? 'Edited in POS' : 'From Loyverse', i.edited ? (i.lv || 'not in Loyverse yet') : ''].filter(Boolean).join(' · ')})]),
            el('span', {className: 'amt', textContent: 'Edit'})]);
          if (i.hidden) b.style.opacity = '.55';
          b.onclick = () => editItem(i, draw);
          list.append(b);
        }
      }
    };
    q.oninput = draw; draw();
    upd.onclick = () => {
      upd.disabled = true; upd.textContent = 'Updating\u2026';
      api.get('pos=loyverse').then(r => {
        if (!r.ok) throw new Error(r.error || 'Loyverse did not answer');
        jset('pos-lv', {at: r.at, items: r.items}); catalogue(); buildCats(); render(); draw(); info.textContent = lvNote();
        toast(r.items.length + ' items loaded from Loyverse');
      }).catch(e => toast('Could not update from Loyverse: ' + (e.message || 'no internet')))
        .finally(() => { upd.disabled = false; upd.textContent = 'Update from Loyverse'; });
    };
    addB.onclick = () => editItem(null, draw);
    ren.onclick = () => renameCat(draw);
    const sync = el('button', {className: 'btn o', textContent: 'Sync changes to Loyverse'});
    sync.onclick = () => {
      sync.disabled = true; sync.textContent = 'Syncing\u2026';
      lvSync(null).then(r => { toast(r.synced + ' item' + (r.synced === 1 ? '' : 's') + ' updated in Loyverse' + (r.error ? ' \u00b7 some failed' : '')); draw(); })
        .catch(e => toast('Loyverse sync failed: ' + e.message)).finally(() => { sync.disabled = false; sync.textContent = 'Sync changes to Loyverse'; });
    };
    bd.append(info, el('div', {className: 'row3'}, [upd, ren, addB]), sync,
      el('p', {className: 'note', textContent: 'Sync sends every POS change that is not in Loyverse yet (name, category, price, hidden) to Loyverse. Admin only.'}), q, list);
  });
}

function editItem(i, after) {
  sheet(i ? 'Edit item' : 'Add item', (bd, close) => {
    const nm = el('input', {value: i ? i.name : '', maxLength: 60, placeholder: 'Item name'});
    const cat = el('input', {value: i ? i.cat : (catSel.value || ''), maxLength: 40, placeholder: 'Category'});
    cat.setAttribute('list', 'pos-cats');
    const dl = el('datalist', {id: 'pos-cats'}, CATS.map(c => el('option', {value: c})));
    const pr = el('input', {type: 'number', inputMode: 'decimal', min: 0, step: '0.01', value: i ? i.price : ''});
    const hid = el('input', {type: 'checkbox', checked: !!(i && i.hidden)});
    const err = el('p', {className: 'warn'});
    const save = el('button', {className: 'btn g', textContent: 'Save'});
    const toLv = el('input', {type: 'checkbox', checked: true});
    const btns = [save];
    if (i && i.edited) {
      const rs = el('button', {className: 'btn o', textContent: i.added ? 'Delete item' : 'Reset to Loyverse'});
      rs.onclick = () => { rs.disabled = true; resetItems([i.key]).then(() => { toast(i.added ? 'Item deleted' : 'Back to the Loyverse version'); close(); if (after) after(); })
        .catch(e => { err.textContent = e.message; rs.disabled = false; }); };
      btns.unshift(rs);
    }
    save.onclick = () => {
      const name = nm.value.trim(), price = pr.value === '' ? null : Number(pr.value);
      if (!name) { err.textContent = 'Give the item a name.'; return; }
      if (price == null || !(price >= 0)) { err.textContent = 'Enter a price.'; return; }
      save.disabled = true;
      saveItems([{key: i ? i.key : '', name, cat: cat.value.trim() || 'Other', price, hidden: hid.checked}])
        .then(r => {
          if (!toLv.checked) { toast('Saved for every POS device'); close(); if (after) after(); return; }
          const key = i ? i.key : ((r.edits || []).filter(e => e.key.startsWith('new:') && e.name === name).map(e => e.key).sort().pop());
          return lvSync([key]).then(s => { toast(s.ok ? 'Saved and updated in Loyverse' : 'Saved, but Loyverse said: ' + s.error); close(); if (after) after(); })
            .catch(e2 => { toast('Saved in the POS, but not in Loyverse: ' + e2.message); close(); if (after) after(); });
        })
        .catch(e => { err.textContent = e.message; save.disabled = false; });
    };
    bd.append(el('label', {}, ['Name', nm]), el('label', {}, ['Category', cat]), dl, el('label', {}, ['Price (\u20b1)', pr]),
      el('label', {className: 'tog'}, [el('span', {textContent: 'Hide from the register'}), hid]),
      el('label', {className: 'tog'}, [el('span', {textContent: 'Also update in Loyverse'}), toLv]), err,
      el('div', {className: btns.length > 1 ? 'row2' : ''}, btns));
  });
}

function renameCat(after) {
  sheet('Rename category', (bd, close) => {
    const from = el('select', {}, CATS.map(c => new Option(c, c)));
    const to = el('input', {maxLength: 40, placeholder: 'New name'});
    const err = el('p', {className: 'warn'}), go = el('button', {className: 'btn g', textContent: 'Rename'});
    go.onclick = () => {
      const nn = to.value.trim(); if (!nn) { err.textContent = 'Type the new name.'; return; }
      const xs = ITEMS.filter(i => i.cat === from.value); go.disabled = true;
      saveItems(xs.map(i => ({key: i.key, name: i.name, cat: nn, price: i.price, hidden: !!i.hidden})))
        .then(() => { toast(xs.length + ' items moved to ' + nn); close(); if (after) after(); })
        .catch(e => { err.textContent = e.message; go.disabled = false; });
    };
    bd.append(el('p', {className: 'note', textContent: 'Moves every item in the category to the new name, on every POS device.'}),
      el('label', {}, ['Category', from]), el('label', {}, ['New name', to]), err, go);
  });
}
$('#manageBtn').onclick = showManage;

// ---- stock flags + one-tap sync ---------------------------------------------------------------------
var STOCK = {};   // var: renderGrid may run before this line
function loadStock() {
  if (!session) return Promise.resolve();
  return api.get('pos=inventory&token=' + encodeURIComponent(session.token)).then(r => {
    if (r.ok) { STOCK = Object.fromEntries(Object.entries(r.items || {}).map(([k, v]) => [k, {status: v.status, left: v.canMake, short: v.short}])); renderGrid(); }   // per item, from its recipe's supplies
  }).catch(() => {});
}
setInterval(() => { if (!document.hidden) loadStock(); }, 5 * 60000);

async function syncAll() {
  const btn = $('#syncBtn');
  if (btn.classList.contains('spin')) return;
  btn.classList.add('spin');
  const done = [];
  try {
    if (session && session.role === 'admin') {
      try { const r = await lvSync(null); if (r.synced) done.push(r.synced + ' change' + (r.synced === 1 ? '' : 's') + ' sent to Loyverse'); if (r.error) done.push('some not sent'); }
      catch (e) { done.push('Loyverse send failed'); }
    }
    const lv = await api.get('pos=loyverse');
    if (lv.ok) { jset('pos-lv', {at: lv.at, items: lv.items}); done.push(lv.items.length + ' items from Loyverse'); }
    await refreshEdits();
    await loadStock();
    catalogue(); buildCats(); render();
    toast('Synced: ' + (done.join(' · ') || 'up to date'));
  } catch (e) {
    toast('Sync failed: ' + (e.message || 'no internet'));
  } finally { btn.classList.remove('spin'); }
}
$('#syncBtn').onclick = syncAll;

render();
refreshEdits();
loadStock();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
